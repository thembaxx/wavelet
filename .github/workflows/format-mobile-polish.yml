name: Temporary wavelet mobile-polish formatting
on:
  push:
    branches: [ui/mobile-native-polish-20261104]
    paths:
      - .github/workflows/format-mobile-polish.yml
permissions:
  contents: write
concurrency:
  group: wavelet-mobile-polish-format
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'thembaxx/wavelet' && github.ref == 'refs/heads/ui/mobile-native-polish-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Format only PR-related and known format-blocker files
        run: |
          set -euo pipefail
          bunx oxfmt --write app/mobile-ux.css components/MusicAccountModal.tsx
          git add -- app/mobile-ux.css components/MusicAccountModal.tsx
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: apply repository formatter for mobile polish'
            git push origin HEAD:ui/mobile-native-polish-20261104
          fi
