name: Temporary particle formatting export
on:
  push:
    branches: [feat/r187-particle-visuals]
    paths: [.github/workflows/particle-format-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching formatter
        run: npm install -g oxfmt@0.75.0
      - name: Export formatted source
        run: |
          oxfmt --write components/IsometricVinylStage.tsx lib/beat-particle-halo.ts app/mobile-ux.css components/WaveletGame.tsx
          for file in components/IsometricVinylStage.tsx lib/beat-particle-halo.ts app/mobile-ux.css components/WaveletGame.tsx; do
            echo "BEGIN_FORMATTED:$file"
            base64 -w76 "$file"
            echo "END_FORMATTED:$file"
          done
