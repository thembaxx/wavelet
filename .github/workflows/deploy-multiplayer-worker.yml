name: Deploy Wavelet multiplayer Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/multiplayer/**"
      - ".github/workflows/deploy-multiplayer-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wavelet-multiplayer-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify Cloudflare token format and API authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN ?? '';
          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }
          if (!token) fail('CLOUDFLARE_API_TOKEN is missing. Add it to Wavelet repository Actions secrets.');
          if (/^\s*(Bearer|Token)\s+/i.test(token))
            fail('CLOUDFLARE_API_TOKEN contains an Authorization prefix. Paste only the raw token, without Bearer.');
          if (/^['"`]|['"`]$/.test(token))
            fail('CLOUDFLARE_API_TOKEN contains surrounding quotation marks. Re-save only the raw token.');
          if (/\s/.test(token) || /[^\x21-\x7e]/.test(token))
            fail('CLOUDFLARE_API_TOKEN contains whitespace or non-ASCII characters. Re-paste the raw token.');
          const endpoints = [
            'https://api.cloudflare.com/client/v4/user/tokens/verify',
            'https://api.cloudflare.com/client/v4/accounts/4558b6cb691038495ac4966102bdb898/tokens/verify',
          ];
          const errors = [];
          for (const endpoint of endpoints) {
            try {
              const response = await fetch(endpoint, {
                headers: { Authorization: `Bearer ${token}` },
                signal: AbortSignal.timeout(15000),
              });
              const result = await response.json();
              if (response.ok && result.success === true && result.result?.status === 'active') {
                console.log('Cloudflare accepted an active API token. Proceeding to Worker deployment.');
                process.exit(0);
              }
              errors.push(`${response.status}: ${(result.errors ?? []).map(e => e.code).join(',') || 'token not active'}`);
            } catch {
              errors.push('verification endpoint unavailable');
            }
          }
          fail(`Cloudflare API token verification failed (${errors.join('; ')}). Replace the Actions secret with a raw, active Cloudflare API token from the correct account. No Worker was deployed.`);
          NODE

      - name: Verify Worker API access before building
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const account = '4558b6cb691038495ac4966102bdb898';
          const worker = 'wavelet-multiplayer';
          const root = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts';
          const headers = { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN };
          function fail(message) { console.error('::error::' + message); process.exit(1); }
          async function check(url) {
            try {
              const response = await fetch(url, { headers, signal: AbortSignal.timeout(15000) });
              const body = await response.json().catch(() => ({}));
              return { response, body };
            } catch { fail('Could not reach Cloudflare Workers API for permission preflight.'); }
          }
          const scripts = await check(root);
          if (!scripts.response.ok || scripts.body.success !== true) {
            const codes = (scripts.body.errors ?? []).map(e => e.code).join(',') || scripts.response.status;
            fail('Token is active but cannot list Workers scripts on the configured account (code ' + codes + '). Grant Workers product Admin for initial Worker creation and check token resource scope.');
          }
          const exists = Array.isArray(scripts.body.result) && scripts.body.result.some(entry => entry.id === worker);
          const secrets = await check(root + '/' + worker + '/secrets');
          if (!secrets.response.ok || secrets.body.success !== true) {
            const codes = (secrets.body.errors ?? []).map(e => e.code).join(',') || secrets.response.status;
            // A brand new script can legitimately return 404, but an access denial must be stopped here.
            if (!(secrets.response.status === 404 && !exists)) {
              fail('Cloudflare denied read access to Worker secrets metadata (HTTP ' + secrets.response.status + ', code ' + codes + '). Token can list Workers but cannot provision this resource. Grant Workers product Admin on the correct Cloudflare account for initial creation, not only individual Worker access.');
            }
          }
          if (!exists) {
            console.log('Target Worker is not listed. Initial Worker creation requires Workers product Admin on this account.');
          }
          console.log('Cloudflare Workers API read permissions verified.');
          NODE

      - name: Install and typecheck Worker
        working-directory: workers/multiplayer
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npx wrangler deploy --dry-run --outdir /tmp/wavelet-multiplayer-worker

      - name: Deploy to Cloudflare
        working-directory: workers/multiplayer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wavelet-multiplayer-deploy.log
          node - <<'NODE'
          const fs = require('node:fs');
          const log = fs.readFileSync('/tmp/wavelet-multiplayer-deploy.log', 'utf8');
          const found = log.match(/https:\/\/wavelet-multiplayer\.[a-zA-Z0-9-]+\.workers\.dev/);
          if (!found) {
            console.error('Could not verify the Workers.dev hostname; check Wrangler output and health manually.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'WAVELET_WORKER_URL=' + found[0] + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Wavelet Worker: ' + found[0] + '\n');
          NODE

      - name: Verify Worker health
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$WAVELET_WORKER_URL/health" | node -e '
              let payload = "";
              process.stdin.on("data", chunk => payload += chunk);
              process.stdin.on("end", () => {
                const body = JSON.parse(payload);
                if (body.ok !== true || body.service !== "wavelet-multiplayer") process.exit(1);
              });
            '; then
              echo "Healthy Cloudflare Worker: $WAVELET_WORKER_URL"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Worker health check failed."
          exit 1
