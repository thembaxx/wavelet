name: Multiplayer Worker validation

on:
  pull_request:
    paths:
      - 'workers/multiplayer/**'
      - 'app/multiplayer/**'
      - 'app/page.tsx'
      - 'components/MultiplayerEntry.tsx'
      - 'tsconfig.json'
      - '.github/workflows/multiplayer.yml'
  push:
    paths:
      - 'workers/multiplayer/**'
      - 'app/multiplayer/**'
      - 'app/page.tsx'
      - 'components/MultiplayerEntry.tsx'
      - 'tsconfig.json'
      - '.github/workflows/multiplayer.yml'

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
        working-directory: workers/multiplayer
      - name: Typecheck Worker
        run: npm run typecheck
        working-directory: workers/multiplayer
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/wavelet-worker
        working-directory: workers/multiplayer

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Run game regression tests
        run: bun run test
      - name: Typecheck Next.js
        run: bunx tsc --noEmit
      - name: Build production app
        run: bun run build
