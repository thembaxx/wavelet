name: Daily feedback review
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-feedback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Existing regression suite
        run: |
          mkdir -p .feedback
          bun run test 2>&1 | tee .feedback/regression.log
      - name: Collect synthetic journey evidence
        run: bun run feedback:collect 2>&1 | tee .feedback/scenarios.log
      - name: Review bounded evidence
        if: ${{ always() }}
        env:
          FEEDBACK_GEMINI_API_KEY: ${{ secrets.FEEDBACK_GEMINI_API_KEY }}
        run: |
          bun run feedback:review --input .feedback/events.jsonl --output .feedback/report.md
          cat .feedback/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wavelet-feedback-${{ github.run_id }}
          path: .feedback/
          retention-days: 7
