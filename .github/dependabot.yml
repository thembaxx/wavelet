version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 10
    groups:
      safe-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      action-updates:
        patterns: ["*"]
