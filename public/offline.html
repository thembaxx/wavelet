<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f2" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline | Wavelet</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f7f8f2;
        --ink: #203d32;
        --accent: #176b56;
      }
      html[data-theme="dark"] {
        --paper: #102721;
        --ink: #edf4e8;
        --accent: #b4dda4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        border-radius: 20px;
        corner-shape: squircle;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
      }
      p {
        font-size: 14px;
        line-height: 1.8;
        opacity: 0.8;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 24px;
        border-radius: 16px;
        corner-shape: squircle;
        background: var(--accent);
        color: var(--paper);
        font-weight: 700;
        text-decoration: none;
      }
    </style>
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("wavelet_studio_preferences_v1") || "{}");
          var t =
            p.theme === "dark" || p.theme === "light"
              ? p.theme
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          document.querySelector("meta[name=theme-color]").content =
            t === "dark" ? "#102721" : "#f7f8f2";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main>
      <img src="/brand/wavelet-icon-96.webp" alt="" width="64" height="64" />
      <h1>The groove is still here.</h1>
      <p>
        You’re offline. Your saved studio and previously played song clips are available from the
        home screen.
      </p>
      <a href="/">Open your studio</a>
    </main>
  </body>
</html>
